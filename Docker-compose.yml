# docker-compose.yml
services:
  db:
    image: postgres:15-alpine
    container_name: tiktok_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    container_name: tiktok_bot
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./videos:/app/videos
      - ./logs:/app/logs
    working_dir: /app
    command: python bot.py

volumes:
  postgres_data: